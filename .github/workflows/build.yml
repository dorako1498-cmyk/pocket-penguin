name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Check APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$ANDROID_HOME/build-tools/34.0.0
          $BT/aapt dump badging $APK | head -20
          $BT/apksigner verify --verbose --print-certs $APK
          VER=$($BT/aapt dump badging $APK | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          cp $APK pocket-penguin-$VER.apk
          echo "VER=$VER" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-penguin-apk
          path: pocket-penguin-*.apk
          if-no-files-found: error
      # Publish the APK as a plain file on the Releases page so a phone can download it directly (no zip).
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest pocket-penguin-$VER.apk --target "$GITHUB_SHA" --prerelease \
            --title "Pocket Penguin $VER (最新ビルド)" \
            --notes "ブランチ ${GITHUB_REF_NAME} / コミット ${GITHUB_SHA::7} からの自動ビルドです。下の .apk をタップしてダウンロードしてください。"

  # Install the APK on emulators to catch "app not installed" errors before trying on a phone.
  install-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: pocket-penguin-apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r pocket-penguin-*.apk 2>&1 | tee install.log
            adb shell pm list packages | grep pocketpenguin || true
            adb logcat -d | grep -iE "PackageManager|pocketpenguin|INSTALL_" | tail -60 || true
            adb shell am start -W -n com.pocketpenguin/.MainActivity || true
            sleep 5
            adb logcat -d -b crash | tail -60 || true
            grep -q Success install.log
