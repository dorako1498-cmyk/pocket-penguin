name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Check APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$ANDROID_HOME/build-tools/34.0.0
          $BT/aapt dump badging $APK | head -20
          $BT/apksigner verify --verbose --print-certs $APK
          VER=$($BT/aapt dump badging $APK | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          cp $APK pocket-penguin-$VER.apk
          echo "VER=$VER" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-penguin-apk
          path: pocket-penguin-*.apk
          if-no-files-found: error
      # Publish the APK as a plain file on the Releases page so a phone can download it directly (no zip).
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest pocket-penguin-$VER.apk --target "$GITHUB_SHA" --prerelease \
            --title "Pocket Penguin $VER (最新ビルド)" \
            --notes "ブランチ ${GITHUB_REF_NAME} / コミット ${GITHUB_SHA::7} からの自動ビルドです。下の .apk をタップしてダウンロードしてください。"

  # Install the APK on emulators to catch "app not installed" errors before trying on a phone.
  install-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: pocket-penguin-apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            adb install -r pocket-penguin-*.apk 2>&1 | tee install.log
            adb shell pm list packages | grep pocketpenguin || true
            adb logcat -d | grep -iE "PackageManager|pocketpenguin|INSTALL_" | tail -60 || true
            adb shell am start -W -n com.pocketpenguin/.MainActivity || true
            sleep 5
            adb logcat -d -b crash | tail -60 || true
            grep -q Success install.log
            mkdir -p shots
            adb shell am force-stop com.pocketpenguin || true
            printf '%s\n' "<?xml version='1.0' encoding='utf-8' standalone='yes' ?>" '<map><int name="test_scene" value="4" /></map>' > penguin.xml
            adb push penguin.xml /data/local/tmp/penguin.xml || true
            adb shell run-as com.pocketpenguin mkdir -p shared_prefs || true
            adb shell run-as com.pocketpenguin cp /data/local/tmp/penguin.xml shared_prefs/penguin.xml || true
            adb shell am start -a android.service.wallpaper.CHANGE_LIVE_WALLPAPER --ecn android.service.wallpaper.extra.LIVE_WALLPAPER_COMPONENT com.pocketpenguin/.PenguinWallpaperService || true
            sleep 2
            adb shell input swipe 540 1900 540 2350 300 || true
            for i in 1 2 3 4 5 6 7 8; do sleep 3; adb exec-out screencap -p > shots/api${{ matrix.api }}-s$i.png || true; done
            adb shell input swipe 540 1900 540 2350 300 || true
            sleep 2
            adb exec-out screencap -p > shots/api${{ matrix.api }}-c.png || true
            adb logcat -d -b crash | tail -40 || true
      # Screenshots of the wallpaper preview, kept on a separate branch so they can be looked at without downloading artifacts
      - name: Publish screenshots
        if: always()
        run: |
          set +e
          ls -la shots || exit 0
          git init -q pub && cd pub
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin ci-screenshots && git checkout -q ci-screenshots || git checkout -q --orphan ci-screenshots
          cp ../shots/*.png . && git add -A && git commit -qm "Screenshots for ${GITHUB_SHA::7} (API ${{ matrix.api }})" || exit 0
          for i in 1 2 3; do git push -q origin HEAD:ci-screenshots && break; git pull -q --rebase origin ci-screenshots; sleep 3; done
