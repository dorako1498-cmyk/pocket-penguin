name: Install test
on:
  workflow_run:
    workflows: [Build APK]
    types: [completed]
  workflow_dispatch:
jobs:
  install:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download APK from Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apk-latest --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --output app.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk 2>&1 | tee install.log; adb shell pm list packages | grep pocketpenguin; adb logcat -d | grep -iE "PackageManager|pocketpenguin|INSTALL_" | tail -60; adb shell am start -W -n com.pocketpenguin/.MainActivity; sleep 5; adb logcat -d -b crash | tail -60; grep -q Success install.log
