# ミモザデータ：承認済み投稿を予定時刻に X へ投稿（1日2回）
name: "XA: post scheduled"
on:
  schedule:
    - cron: "50 22 * * *"   # 07:50 JST（07:45 枠）
    - cron: "20 12 * * *"   # 21:20 JST（21:15 枠）
  workflow_dispatch:
concurrency:
  group: xa-post
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x-affiliate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: x-affiliate/requirements.txt
      - run: pip install -r requirements.txt
      - name: Post due items
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/post_scheduled.py
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/state
          git diff --cached --quiet && exit 0
          git commit -m "xa: update posted state"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
