# 最初の30日間の投稿プラン（60本：1日2本 07:45 / 21:15）
# 週次ワークフローが、未使用の日から順に「翌週の日付」に割り当てて PR を作る（PRマージ＝承認）。
# 比率: A16 / B8 / C16 / D8 / E7 / F5（docs/07_post_system.md）
# {{stat:...}} はデータ取得後に実数へ置換。未取得なら投稿されない（ブロック）ので、架空の数字が出ることはない。
posts:
  # ---------------- Week 1：自己紹介・定義・全国統計 ----------------
  - day: 1
    slot: "07:45"
    type: B
    theme: company_check
    text: |
      はじめまして、ミモザデータ編集部です。
      「女性が働きやすい会社」を、会社が公表している数字で読み解くアカウントです。
      ・男女の賃金差異
      ・女性管理職比率
      ・男性の育休取得率
      体験談ではなく、出典つきのデータで。転職を煽らず、選択肢を増やす情報を届けます。
    sources: []
  - day: 1
    slot: "21:15"
    type: C
    theme: paygap
    text: |
      「男女の賃金の差異」は、男性の平均賃金を100としたときの女性の平均賃金です。
      注意したいのは、同じ仕事どうしの比較ではないこと。管理職や賃金の高い職種に男性が多いと、数字は低くなります。
      つまりこれは会社の点数ではなく「構造のサイン」です。
    sources: [厚生労働省 女性活躍推進法に基づく情報公表制度（男女の賃金の差異）]
  - day: 2
    slot: "07:45"
    type: A
    theme: paygap
    text: |
      女性の賃金は、男性を100とすると75.8。
      厚生労働省の2024年の調査では、比較できる1976年以降で差が最も小さくなりました。
      縮まってはいる。でも、まだ4分の1近い差があります。
      この差が「どこで」生まれているのか、会社単位のデータで見ていきます。
    sources: [厚生労働省『令和6年賃金構造基本統計調査』（一般労働者・男女間賃金格差）]
  - day: 2
    slot: "21:15"
    type: D
    theme: career_move
    text: |
      求人票の「女性活躍中」。気になるのは、その中身ですよね。
      育休から戻った人がどんな仕事をしているか、評価はどう運用されているか。こうした情報は求人票に載りにくいものです。
      転職エージェントの面談は、この「中身」を担当者に聞く場としても使えます。
    affiliate: false
    sources: []
  - day: 3
    slot: "07:45"
    type: A
    theme: law_policy
    text: |
      男性の育休取得率は40.5%（2024年度）。前年度の30.1%から伸び、初めて4割を超えました。
      これは女性にとっても大事な数字です。「育児をする社員」を前提に職場が回っているかが見えるから。
      2025年4月からは、従業員300人超の会社に公表義務があります。
    sources: [厚生労働省『令和6年度雇用均等基本調査』, 育児・介護休業法 改正（2025年4月施行）]
  - day: 3
    slot: "21:15"
    type: C
    theme: company_check
    text: |
      データを見るとき、編集部が確認していること。
      ・いつ時点の数字か
      ・全労働者か、正規雇用だけか
      ・女性が少なく、数字がぶれやすくないか
      ・同じ業種の中で比べているか
      読み方を間違えると、誰かを不当に評価してしまう。だから読み方ごとお届けします。
    sources: []
  - day: 4
    slot: "07:45"
    type: A
    theme: law_policy
    text: |
      2026年4月から、従業員101人以上の会社にも「男女の賃金の差異」と「女性管理職比率」の公表が義務になりました。
      これまで賃金差異の公表は301人以上だけ。
      中堅・中小企業の数字も見えるようになり、転職先を数字で比べられる範囲がぐっと広がりました。
    sources: [女性活躍推進法 改正（2026年4月1日施行）]
  - day: 4
    slot: "21:15"
    type: E
    theme: law_policy
    text: |
      2026年4月の女性活躍推進法の改正、ポイントは3つです。
      ・賃金差異の公表が101人以上の会社に拡大
      ・女性管理職比率も公表義務に
      ・法律の期限が2036年まで延長
      働く人にとって何が「見える」ようになったのか、記事にまとめました。
    link: {article: women-act-2026-revision}
    affiliate: false
    sources: [女性活躍推進法 改正（2026年4月1日施行）]
  - day: 5
    slot: "07:45"
    type: B
    theme: company_check
    text: |
      ミモザデータで扱うテーマはこの5つです。
      ・男女の賃金差異を読み解く
      ・働きやすい会社の見分け方
      ・転職・異動・交渉の選択肢
      ・制度や法改正をやさしく
      ・働き方とジェンダーを考える本
      「数字で選ぶ」ための材料を、少しずつためていきましょう。
    sources: []
  - day: 5
    slot: "21:15"
    type: C
    theme: company_check
    text: |
      「えるぼし」と「くるみん」の違いを一言で。
      ・えるぼし：女性の活躍推進の取り組みが優良な企業の認定
      ・くるみん：子育てサポート企業の認定
      どちらも上位に「プラチナ」があります。
      ただし、認定がない＝働きにくい、ではありません。判断材料の一つとして。
    sources: [厚生労働省 えるぼし認定（女性活躍推進法）, 厚生労働省 くるみん認定（次世代育成支援対策推進法）]
  - day: 6
    slot: "07:45"
    type: A
    theme: paygap
    text: |
      世界経済フォーラムのジェンダーギャップ指数2025年版で、日本は148か国中118位でした。
      特に差が大きいのは「政治」と「経済」の分野。
      経済分野の差は、管理職の少なさや賃金の差として、私たちの職場の数字にも表れています。
    sources: [World Economic Forum『Global Gender Gap Report 2025』]
  - day: 6
    slot: "21:15"
    type: D
    theme: company_check
    text: |
      会社の公表データは「制度と結果」。
      一方で、残業の実態や育休明けの空気など、日々の実感は数字に出にくいものです。
      社員口コミサイトは、この「数字に出ない部分」を補う道具として使えます。
      ただし口コミは個人の感想。複数の声を見るのがコツです。
    affiliate: false
    sources: []
  - day: 7
    slot: "07:45"
    type: C
    theme: company_check
    text: |
      このアカウントが体験談を書かない理由。
      誰かの経験は心に響きますが、その会社・その時期・その人の条件でしか成り立たないことも多いからです。
      代わりに、会社が公表した数字と、その読み方をお届けします。
      判断するのはあなた自身。そのための材料を。
    sources: []
  - day: 7
    slot: "21:15"
    type: C
    theme: paygap
    text: |
      賃金差異を見るなら「全労働者」と「正規雇用」を見比べるのがおすすめです。
      全労働者の差だけが大きい会社は、非正規雇用に女性が偏っていることが主な要因かもしれません。
      正社員で応募するなら、正規雇用の数字を重視して見ましょう。
    sources: [厚生労働省 女性活躍推進法に基づく情報公表制度（男女の賃金の差異）]

