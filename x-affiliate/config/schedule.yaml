# 投稿スロット（日本時間）。generate_posts.py が週次でこの枠を埋める。
timezone: Asia/Tokyo
slots:
  - time: "07:45"     # 通勤時間帯：A/B（インプレッション・フォロー獲得）
    types: [A, B, C]
  - time: "21:15"     # 夜：C/D/E（信頼・興味喚起・送客）
    types: [C, D, E, F]
posts_per_week: 14

# 30日間の投稿タイプ比率（docs/07_post_system.md 参照）
type_mix:
  A: 0.25   # インプレッション獲得
  B: 0.15   # フォロー獲得
  C: 0.25   # 信頼獲得
  D: 0.15   # 商品・サービスへの興味喚起
  E: 0.12   # 外部リンク送客（記事へ）
  F: 0.08   # 過去コンテンツ再利用

# 同じ予約枠を取り逃した場合、何時間後まで遅れて投稿してよいか
grace_hours: 6
# 1回の実行で投稿する最大数（障害復帰時の連投防止）
max_posts_per_run: 2
# リンクの付け方: reply = 本文はリンクなし→自分の投稿へのリプライでリンク（リンク付き投稿の表示抑制対策）
#                 inline = 本文末尾にリンク
link_mode: reply
