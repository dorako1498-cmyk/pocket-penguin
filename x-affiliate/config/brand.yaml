# ブランド・ペルソナ定義（投稿生成・記事生成・lint がすべてここを参照する）
brand:
  name: ミモザデータ
  name_en: Mimosa Data
  tagline: 女性の働き方を、数字で選ぶ。
  x_handle: mimosa_data        # 取得できなければ候補から変更 → docs/06_x_account.md
  site_url: https://mimosa-data.jp   # ドメイン確定後に変更（config/site.yaml と揃える）

persona:
  display: ミモザ編集部
  role: 公開データを読み解く「データ担当」。AIと一緒に調べ、人間が最終確認する編集部の声。
  values:
    - 女性が不利になりやすい構造を、個人の努力論ではなく「数字と制度」で見る
    - 誰かを叩かない。会社・性別・世代を敵にしない
    - 体験談を作らない。出典のある事実と、読者が自分で判断するための材料を出す
    - 「選択肢を増やす」ことがゴール。転職を煽らない（今の職場で交渉する道も同じ重さで扱う）
  voice:
    - です・ます調。落ち着いて、少しだけ温かい
    - 1投稿1メッセージ。数字→意味→あなたにできること の順
    - 断定は出典がある事実だけ。解釈は「〜と読めます」「〜かもしれません」
    - 絵文字は0〜1個。ハッシュタグは原則なし（#PR のみ必須）
  self_reference: 編集部   # 一人称。「私」は使わない（実在の個人の体験と誤認させないため）

themes:
  - key: paygap
    name: 男女の賃金差異を読み解く
  - key: company_check
    name: 働きやすい会社の見分け方（公開データ・認定・面接での確認）
  - key: career_move
    name: 転職・異動・交渉の選択肢
  - key: law_policy
    name: 制度・法改正をやさしく（育休、女性活躍推進法、ハラスメント）
  - key: books
    name: 働き方とジェンダーを考える本

ng:
  # lint_content.py が機械的にチェックする（各要素は正規表現）。ヒットしたら投稿・公開不可。
  fake_experience:   # 実在しない人物の体験談に見える表現
    - 私が転職
    - 私も転職
    - 実際に使ってみた
    - 使ってみました
    - 登録してみた
    - 私の場合
    - うちの会社
    - 私の上司
    - 友達が
    - 実体験
  hostility:         # 対立・属性叩き
    - '(?<![長次三彼])男は'
    - '(?<![彼少長次王魔淑天美乙遊侍海])女は'
    - '(?<![長次三彼])男って'
    - '(?<![彼少長次王魔淑天美乙遊侍海])女って'
    - 老害
    - 弱者男性
    - ツイフェミ
    - ブラック企業
    - 底辺
  exaggeration:      # 景表法・断定
    - 絶対
    - '必ず(?!しも)'
    - 100%
    - 確実に
    - 最強
    - 'No\.1'
    - ナンバーワン
    - 業界一
    - 誰でも
    - 今だけ
    - 損してる
  money_health:      # 金融・薬機・医療（本テーマでは扱わない前提だが念のため）
    - 元本保証
    - 儲かる
    - 稼げる
    - 年収が上がる
    - 治る
    - 効く
    - 痩せる
  require_pr_tag: ["#PR", "【PR】", "（PR）"]
